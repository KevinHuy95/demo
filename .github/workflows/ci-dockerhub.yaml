name: CI Build, Push to Docker Hub & GitOps Update

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # Dùng máy ảo Cloud miễn phí của GitHub

    steps:
    - name: 1. Checkout mã nguồn
      uses: actions/checkout@v4

    - name: 2. Đăng nhập Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 3. Đóng gói và Push Docker Image lên Docker Hub
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/my-csharp-api:${{ github.sha }}
          ${{ secrets.DOCKERHUB_USERNAME }}/my-csharp-api:latest

    - name: 4. Cập nhật Git Tag vào Repo demo.git để ArgoCD kích hoạt
      run: |
        # Clone repo demo chứa file manifest Kubernetes
        git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/KevinHuy95/demo.git config-repo
        cd config-repo

        # Sửa tag image trong file backend-csharp.yaml
        sed -i "s|image: .*/my-csharp-api:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/my-csharp-api:${{ github.sha }}|g" backend-csharp.yaml

        # Commit và push lại lên GitHub
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add backend-csharp.yaml
        git commit -m "chore(ci): update image tag to ${{ github.sha }} [skip ci]" || exit 0
        git push origin main
