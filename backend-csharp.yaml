apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-csharp-deployment
  namespace: default
  labels:
    app: backend-csharp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # Khởi động Pod mới trước (Zero Downtime)
      maxUnavailable: 0    # Luôn giữ đủ Pod cũ đón traffic
  selector:
    matchLabels:
      app: backend-csharp
  template:
    metadata:
      labels:
        app: backend-csharp
    spec:
      # Nếu repo Docker Hub ở chế độ Private, bỏ comment khối imagePullSecrets bên dưới
      # imagePullSecrets:
      # - name: dockerhub-secret
      containers:
      - name: csharp-api-container
        # Tên image theo định dạng Docker Hub: <username>/<tên-repo>:<tag>
        image: huyvvnb/my-csharp-api:aa9ab3d88fa53ab90c94f69132f51096c83fddfe
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /api/products   # Thay bằng endpoint health check thực tế
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: backend-csharp-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: backend-csharp
  ports:
    - name: http
      port: 5000
      targetPort: 5000
